<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; frame-src blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Bezpečný prohlížeč plánu</title>
  <style>
    html,body{height:100%;margin:0;background:#0d1324;color:#e8edf7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;grid-template-rows:auto 1fr;min-height:100%}
    #status{padding:.65rem 1rem;background:#161f35;color:#cbd5e1;font-size:.875rem;border-bottom:1px solid rgba(255,255,255,.12)}
    iframe{width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Načítám bezpečně oddělený interaktivní plán…</div>
  <iframe id="content" title="Obsah interaktivního plánu" sandbox="allow-scripts allow-forms allow-modals allow-downloads"></iframe>
  <script>
    (()=>{
      const status=document.getElementById('status');
      const frame=document.getElementById('content');
      let loaded=false;
      window.addEventListener('message',event=>{
        const data=event.data||{};
        if(data.type!=='lifehub-plan-load'||typeof data.html!=='string') return;
        frame.srcdoc=data.html;
        frame.title=String(data.title||'Interaktivní plán');
        status.textContent='Plán je spuštěn v odděleném režimu bez přístupu k datům LifeHubu.';
        loaded=true;
      });
      setTimeout(()=>{if(!loaded) status.textContent='Plán se nepodařilo načíst. Vraťte se do knihovny a otevřete jej znovu.';},5000);
    })();
  </script>
</body>
</html>

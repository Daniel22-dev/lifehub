name: One-time import of official Gymnazium logo
on:
  push:
    branches:
      - fix/official-school-logo-pdf-2026-11
    paths:
      - .github/workflows/one-shot-school-logo.yml
permissions:
  contents: write
jobs:
  import-school-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-school-logo-pdf-2026-11
          persist-credentials: true
      - name: Download and embed verified official PNG
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            'https://www.ghrabuvka.cz/build/images/logo.b31efe12.png' \
            --output public/school-logo.png
          python3 - <<'PY'
          import base64
          import struct
          from pathlib import Path
          data = Path('public/school-logo.png').read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Source is not a PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert width >= 300 and height >= 250, (width, height)
          assert len(data) > 1000, 'Logo file is unexpectedly small'
          data_uri = 'data:image/png;base64,' + base64.b64encode(data).decode('ascii')
          Path('src/assets/school-logo-data.js').write_text(
              'export const SCHOOL_LOGO_DATA_URI = ' + repr(data_uri) + ';\n', encoding='utf-8'
          )
          print(f'Official school logo embedded: {width}x{height}; {len(data)} bytes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/school-logo.png src/assets/school-logo-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: embed authentic official school logo as offline asset'
            git push origin HEAD:fix/official-school-logo-pdf-2026-11
          fi

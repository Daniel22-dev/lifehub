name: Temporary mobile overflow diagnosis (safe mock data only)
on:
  push:
    branches:
      - fix/mobile-horizontal-scroll-lifehub-2026-11
    paths:
      - .github/workflows/mobile-overflow-diagnostic.yml
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install browser-only diagnostics dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Generate built CSS / DOM and inspect viewport widths
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lifehub-vite-preview.log 2>&1 &
          sleep 4
          which google-chrome || true
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          for (const width of [320,360,390,412,480,680,768,1024]) {
            const context = await browser.newContext({viewport:{width,height:840},deviceScaleFactor:1,isMobile:width<700,hasTouch:width<700,serviceWorkers:'block'});
            const page = await context.newPage();
            await page.route('**/*.js', route => route.abort());
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.evaluate(() => {
              document.querySelectorAll('.view.active').forEach(el=>el.classList.remove('active'));
              const rewards=document.getElementById('rewards'); rewards.classList.add('active');
              const select=document.getElementById('rewardPeriodSelect');
              select.innerHTML='<option>Září–prosinec 2026 · školní rok 2026/2027</option>';
              document.getElementById('rewardKpis').innerHTML=Array.from({length:4},(_,i)=>'<div class="kpi"><div class="label">Průběžných položek</div><div class="value">'+(i+3)+'</div><div class="sub">Září–prosinec 2026 · školní rok 2026/2027</div></div>').join('');
              document.getElementById('rewardList').innerHTML='<div class="item"><div class="item-top"><div><h4>Vývoj aplikace Language Skills Hub</h4><p>Kompletní zadání pro školu</p></div><strong>110 h</strong></div><div class="actions"><button class="mini-btn">Upravit</button><button class="mini-btn">Smazat</button></div></div>';
              document.querySelectorAll('.lock-screen.active,.unsaved-guard.active').forEach(x=>x.classList.remove('active'));
            });
            const result=await page.evaluate(()=>{
              const viewport=document.documentElement.clientWidth;
              const findName=el=>{const id=el.id?'#'+el.id:'';const klass=typeof el.className==='string'&&el.className.trim()?'.'+el.className.trim().split(/\\s+/).slice(0,3).join('.'):'';return el.tagName.toLowerCase()+id+klass;};
              const els=[...document.body.querySelectorAll('*')].filter(el=>{const rect=el.getBoundingClientRect();return rect.width>1&&rect.height>1&&rect.right>viewport+2}).map(el=>({name:findName(el),x:Math.round(el.getBoundingClientRect().x),right:Math.round(el.getBoundingClientRect().right),w:Math.round(el.getBoundingClientRect().width)}));
              window.scrollTo(500,0);
              return {viewport,root:document.documentElement.scrollWidth,body:document.body.scrollWidth,scrollAfter:window.scrollX,offenders:els.slice(0,28)};
            });
            console.log('MOBILE_LAYOUT '+JSON.stringify({requestedWidth:width,...result}));
            await context.close();
          }
          await browser.close();
          JS
